name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-and-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e backend
          pip install pyyaml

      - name: Validate OpenAPI source of truth
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          spec_path = Path("doc/02-Architecture/API/openapi.yaml")
          data = yaml.safe_load(spec_path.read_text())
          assert data["openapi"].startswith("3.0."), "OpenAPI version must be 3.0.x"
          assert "/api/v1/query" in data["paths"], "Missing query endpoint"
          print("Validated", spec_path)
          PY

      - name: Backend smoke check
        working-directory: backend
        run: |
          python -m compileall app
          python -c "from app.main import app; print(app.title)"
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
